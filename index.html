<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Kündigungs-Assistent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-xl my-6">
        
        <!-- Header mit Einstellungs-Button -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-900">📄 KI Kündigungs-Assistent</h1>
            <button onclick="openSettings()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-xl text-sm font-semibold transition">
                ⚙️ Einstellungen
            </button>
        </div>
        
        <form id="kuendigungForm" class="space-y-6">
            
            <!-- 1. Vertragsart / Dropdown -->
            <div>
                <label class="block text-sm font-semibold mb-2">Art des Vertrags / Branche</label>
                <select id="contractCategory" onchange="updateDynamicFields()" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="Strom / Gas">⚡ Strom- & Gasversorger</option>
                    <option value="Fitnessstudio">🏋️ Fitnessstudio</option>
                    <option value="Internet / Mobilfunk">📱 Internet, Festnetz & Mobilfunk</option>
                    <option value="Streaming / Abo">🎬 Streaming & Abonnements</option>
                    <option value="Versicherung">🛡️ Versicherung</option>
                    <option value="Sonstiges">📝 Sonstiger Vertrag</option>
                </select>
            </div>

            <!-- 2. Unternehmensdaten -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-2">Name des Unternehmens / Anbieters</label>
                    <input type="text" id="companyName" required placeholder="z.B. E.ON, FitX, Vodafone" class="w-full p-3 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Vertrags- / Mitgliedsnummer</label>
                    <input type="text" id="contractNumber" required placeholder="z.B. V-123456789" class="w-full p-3 border rounded-xl">
                </div>
            </div>

            <!-- Dynamisches Zusatzfeld -->
            <div id="dynamicFieldContainer" class="hidden">
                <label id="dynamicLabel" class="block text-sm font-semibold mb-2">Zusatzinfo</label>
                <input type="text" id="extraInfo" placeholder="" class="w-full p-3 border rounded-xl">
            </div>

            <!-- 3. Absenderdaten -->
            <div class="border-t pt-4">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Deine Absenderdaten</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2">Vollständiger Name</label>
                        <input type="text" id="senderName" required placeholder="Dino ..." class="w-full p-3 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Straße & Hausnummer</label>
                        <input type="text" id="senderStreet" required placeholder="Musterstraße 1" class="w-full p-3 border rounded-xl">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2">PLZ & Ort</label>
                        <input type="text" id="senderCity" required placeholder="12345 Musterstadt" class="w-full p-3 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">E-Mail-Adresse (für Rückfragen)</label>
                        <input type="email" id="senderEmail" placeholder="name@example.com" class="w-full p-3 border rounded-xl">
                    </div>
                </div>
            </div>

            <!-- Absenden Button -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-4 rounded-xl transition duration-200 shadow-lg">
                Kündigung professionell generieren 🚀
            </button>
        </form>

        <!-- Ausgabe-Bereich -->
        <div id="resultContainer" class="mt-8 hidden border-t pt-6">
            <h2 class="text-lg font-semibold mb-2 text-gray-700">Generiertes Schreiben:</h2>
            <textarea id="outputLetter" rows="14" class="w-full p-4 border rounded-xl bg-gray-50 font-mono text-sm leading-relaxed outline-none"></textarea>
            <div class="flex gap-4 mt-4">
                <button onclick="copyToClipboard()" class="bg-gray-800 hover:bg-gray-900 text-white px-5 py-3 rounded-xl text-sm font-medium transition">
                    In Zwischenablage kopieren 📋
                </button>
            </div>
        </div>
    </div>

    <!-- Einstellungs-Modal für API-Key und Endpoint -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 md:p-8 rounded-2xl max-w-md w-full shadow-2xl">
            <h3 class="text-xl font-bold mb-4">🔑 API-Konfiguration</h3>
            <p class="text-sm text-gray-600 mb-4">Deine Daten werden sicher lokal in deinem Browser gespeichert (<code>localStorage</code>). Das Modell ist fest auf <code>openai/gpt-oss-120b</code> eingestellt.</p>
            
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-2">API Endpoint URL</label>
                <input type="text" id="apiEndpointInput" value="https://api.groq.com/openai/v1/chat/completions" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold mb-2">API Key</label>
                <input type="password" id="apiKeyInput" placeholder="gsk_..." class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="flex justify-end gap-3">
                <button onclick="closeSettings()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2.5 rounded-xl text-sm font-semibold">Abbrechen</button>
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        // Dynamische Felder je nach Branche einblenden
        function updateDynamicFields() {
            const category = document.getElementById('contractCategory').value;
            const container = document.getElementById('dynamicFieldContainer');
            const label = document.getElementById('dynamicLabel');
            const input = document.getElementById('extraInfo');

            if (category === 'Strom / Gas') {
                container.classList.remove('hidden');
                label.innerText = 'Zählernummer (falls zur Hand)';
                input.placeholder = 'z.B. 1ZBW12345678';
            } else if (category === 'Internet / Mobilfunk') {
                container.classList.remove('hidden');
                label.innerText = 'Telefonnummer / Anschluss-ID';
                input.placeholder = 'z.B. 040 / 1234567';
            } else if (category === 'Versicherung') {
                container.classList.remove('hidden');
                label.innerText = 'Versicherungsscheinnummer';
                input.placeholder = 'z.B. VS-987654321';
            } else {
                container.classList.add('hidden');
                input.value = '';
            }
        }

        // Modal öffnen / schließen
        function openSettings() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('user_ai_api_key') || '';
            document.getElementById('apiEndpointInput').value = localStorage.getItem('user_ai_endpoint') || 'https://api.groq.com/openai/v1/chat/completions';
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const key = document.getElementById('apiKeyInput').value.trim();
            const endpoint = document.getElementById('apiEndpointInput').value.trim();
            if (key) {
                localStorage.setItem('user_ai_api_key', key);
                localStorage.setItem('user_ai_endpoint', endpoint || 'https://api.groq.com/openai/v1/chat/completions');
                alert('Einstellungen erfolgreich im Browser gespeichert!');
                closeSettings();
            } else {
                alert('Bitte gib einen gültigen API-Key ein.');
            }
        }

        // Beim ersten Laden prüfen, ob Key fehlt -> Modal öffnen
        window.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('user_ai_api_key')) {
                openSettings();
            }
        });

        // Kündigung generieren per API-Call
        document.getElementById('kuendigungForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const apiKey = localStorage.getItem('user_ai_api_key');
            const apiEndpoint = localStorage.getItem('user_ai_endpoint') || 'https://api.groq.com/openai/v1/chat/completions';

            if (!apiKey) {
                alert('Bitte hinterlege zuerst deinen API-Key in den Einstellungen (⚙️)!');
                openSettings();
                return;
            }

            const modelName = 'openai/gpt-oss-120b';

            // Formulardaten einsammeln
            const category = document.getElementById('contractCategory').value;
            const companyName = document.getElementById('companyName').value;
            const contractNumber = document.getElementById('contractNumber').value;
            const extraInfo = document.getElementById('extraInfo').value;
            const senderName = document.getElementById('senderName').value;
            const senderStreet = document.getElementById('senderStreet').value;
            const senderCity = document.getElementById('senderCity').value;
            const senderEmail = document.getElementById('senderEmail').value;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "KI schreibt Kündigung...";

            const resultContainer = document.getElementById('resultContainer');
            const outputLetter = document.getElementById('outputLetter');
            resultContainer.classList.remove('hidden');
            outputLetter.value = "Formuliere rechtssicheren Geschäftsbrief mit openai/gpt-oss-120b...";

            const systemPrompt = `Du bist ein hochpräziser juristischer Assistent für deutsches Vertragsrecht. Erstelle absolut professionelle, formgerechte und rechtssichere deutsche Kündigungen im Geschäftsbrief-Stil (nach DIN 5008). 
            - Verwende immer die Formulierung "fristgerecht zum nächstmöglichen Termin".
            - Fordere unmissverständlich eine schriftliche Kündigungsbestätigung unter Angabe des genauen Beendigungsdatums ein.
            - Füge den Satz hinzu, dass das SEPA-Lastschriftmandat zum Wirksamkeitsdatum widerrufen wird.
            - Keine flapsigen Formulierungen, sauber strukturiert mit Absender, Empfänger, Betreff, Datum und Unterschriftenfeld.`;

            const userPrompt = `Erstelle eine professionelle Kündigung für folgende Daten:
            - Vertragsart: ${category}
            - Unternehmen: ${companyName}
            - Vertrags-/Mitgliedsnummer: ${contractNumber}
            - Zusätzliche Info: ${extraInfo || 'Keine'}
            - Absender: 
              ${senderName}
              ${senderStreet}
              ${senderCity}
              E-Mail: ${senderEmail || 'Nicht angegeben'}`;

            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ],
                        temperature: 0.2
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || JSON.stringify(data.error));
                }

                outputLetter.value = data.choices[0].message.content;
                resultContainer.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                alert('Fehler bei der API-Anfrage: ' + error.message);
                outputLetter.value = "Fehler: " + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Kündigung professionell generieren 🚀";
            }
        });

        function copyToClipboard() {
            const textarea = document.getElementById('outputLetter');
            textarea.select();
            document.execCommand('copy');
            alert('Kündigung in die Zwischenablage kopiert!');
        }
    </script>
</body>
</html>
